name: Build 怀旧游戏厅 IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    # 使用 GitHub 当前可用的 macOS 镜像
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned .app
        run: |
          xcodebuild \
            -project Arcade.xcodeproj \
            -scheme Arcade \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            build 2>&1 | tee xcodebuild.log
          test -d build/Build/Products/Release-iphoneos/Arcade.app

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Arcade.app"
          mkdir -p Payload
          cp -R "$APP" Payload/Arcade.app
          zip -qry Arcade.ipa Payload
          ls -lh Arcade.ipa
          shasum -a 256 Arcade.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Arcade-unsigned-ipa
          path: |
            Arcade.ipa
            xcodebuild.log
          retention-days: 30
